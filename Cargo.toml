[workspace]
resolver = "2"
members = [
    "crates/fileflow-core",
    "crates/fileflow-catalog",
    "crates/fileflow-rpc",
    "crates/fileflow-service",
    "crates/fileflow-client",
    "crates/fileflow-shell",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.83"
repository = "https://github.com/fileflow/fileflow-native"

[workspace.dependencies]
fileflow-core = { path = "crates/fileflow-core" }
fileflow-catalog = { path = "crates/fileflow-catalog" }
fileflow-rpc = { path = "crates/fileflow-rpc" }
fileflow-client = { path = "crates/fileflow-client" }
anyhow = "=1.0.95"
dirs = "=5.0.1"
hex = "=0.4.3"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"
sha2 = "=0.10.8"
tempfile = "=3.14.0"
thiserror = "=2.0.11"
tokio = { version = "=1.43.0", features = ["full"] }
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter"] }
walkdir = "=2.5.0"
